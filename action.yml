name: "Junie GH Action v1.0"
description: "Powerful GitHub automation with Junie."
branding:
  icon: "at-sign"
  color: "green"

inputs:
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@junie"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @junie)"
    required: false
  label_trigger:
    description: "The label that triggers the action (e.g. junie)"
    required: false
    default: "junie"
  base_branch:
    description: "The branch to use as the source when creating junie working branch"
    required: false

  # Junie configuration
  prompt:
    description: "Instructions for Junie. Can be a direct prompt or custom template."
    required: false
    default: ""
  junie_version:
    description: "Version of Junie to use"
    required: false
    default: "443.1"

  # Auth configuration
  junie_api_key:
    description: "Junie API key"
    required: false
  github_token:
    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"
    required: false

outputs:
  execution_file:
    description: "Path to the Junie execution result file"
    value: ${{ steps.junie-run.outputs.results_file }}
  branch_name:
    description: "Junie working branch"
    value: ${{ steps.prepare.outputs.WORKING_BRANCH }}

runs:
  using: "composite"
  steps:
    - name: Install Bun
      if: inputs.path_to_bun_executable == ''
      uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # https://github.com/oven-sh/setup-bun/releases/tag/v2.0.2

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${GITHUB_ACTION_PATH}
        bun install

    - name: Prepare action
      id: prepare
      shell: bash
      run: |
        bun run ${GITHUB_ACTION_PATH}/src/entrypoints/prepare.ts
      env:
        APP_TOKEN: ${{ inputs.junie_api_key }}
        PROMPT: ${{ inputs.prompt }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        LABEL_TRIGGER: ${{ inputs.label_trigger }}
        BASE_BRANCH: ${{ inputs.base_branch || github.base_ref  }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        ALL_INPUTS: ${{ toJson(inputs) }}

    - name: Install Junie
      shell: bash
      run: npm install -g @jetbrains/junie-cli

    - name: Run Junie
      shell: bash
      env:
        CLI_TOKEN: ${{ steps.prepare.outputs.junie_cli_token }}
        EJ_TASK: ${{ steps.prepare.outputs.task }}
        EJ_AUTH_GITHUB_TOKEN: ${{ steps.prepare.outputs.junie_runner_token  }}
        EJ_TASK_TEXT: ${{ steps.prepare.outputs.ej_task_text }}
        MULTI_RUNS: true
        MATTERHORN_DEBUG_LOG: false
      run: |
        junie --auth="${CLI_TOKEN}" "${EJ_TASK}"

    - name: Revoke app token
      if: always() && inputs.github_token == '' && steps.prepare.outputs.skipped_due_to_workflow_validation_mismatch != 'true'
      shell: bash
      run: |
        curl -L \
          -X DELETE \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.prepare.outputs.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          ${GITHUB_API_URL:-https://api.github.com}/installation/token
