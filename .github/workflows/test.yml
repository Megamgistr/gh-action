name: Test that always fails
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  failing-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run failing test
        run: |
          echo "Running tests..."
          echo "Test 1: PASSED"
          echo "Test 2: PASSED"
          echo "Test 3: FAILED - Assertion error: Expected 5 but got 3"
          echo "Error: Test suite failed with 1 failure"
          exit 1
