name: analyze-failed-checks.yml
on:
  check_suite:
    types: [completed]

jobs:
  junie:
    if: github.event.check_suite.conclusion == 'failure' && github.event.check_suite.pull_requests.length > 0
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Junie
        id: claude
        uses: ./.
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
