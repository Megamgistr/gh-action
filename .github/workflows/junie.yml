name: Junie

on:
  issues:
    types: [opened]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]

jobs:
  junie:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Junie
        id: claude
        uses: ./.
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          github_token: ${{ secrets.JUNIE_GITHUB_TOKEN }}
